<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Admin · Book Club IIT Kanpur</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon-32.png">
</head>
<body>
  <!-- Sveltia CMS: edits the content/ files in the GitHub repository. Sign in with a GitHub account that has access.
       Pinned to one version with an integrity hash, so a tampered copy on the CDN is refused. To update, change the
       version and replace the hash with that of the new file (see README, "Updating the admin panel").
       The sign-in token is kept in this browser for this site, so the panel loads only at its own address
       (not on iitk.ac.in, where every IITK page shares the storage) and never inside another site's frame.
       If the repository moves, change HOME below. -->
  <script>
    (function () {
      var HOME = "https://shubhamkmaurya03.github.io";
      var local = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(location.origin);
      if (window.top !== window.self) { document.documentElement.style.display = "none"; return; }
      if (location.origin !== HOME && !local) {
        document.body.innerHTML = '<p style="font:18px/1.5 Georgia,serif;max-width:34em;margin:15vh auto;padding:0 20px">' +
          'The admin panel opens only at <a href="' + HOME + '/bookclubiitk/admin/">' + HOME + '/bookclubiitk/admin/</a>.</p>';
        return;
      }
      var s = document.createElement("script");
      s.src = "https://unpkg.com/@sveltia/cms@0.250.1/dist/sveltia-cms.js";
      s.integrity = "sha384-0w9lix5secQDl5n7BX0n4v4ufSZM6VZI9Ov7SAVYPG5Z4lMN3i3OYoljubY5vdio";
      s.crossOrigin = "anonymous";
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
