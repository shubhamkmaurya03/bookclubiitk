# Rebuilds the website whenever something is saved to main (by the admin panel or a push)
# and publishes the result to the `site` branch. GitHub Pages serves that branch, and the
# IITK copy is uploaded from it: download
#   https://github.com/shubhamkmaurya03/bookclubiitk/archive/refs/heads/site.zip
name: Build and publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"   # daily at 10:00 IST, to pick up books newly added in Koha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -r tools/requirements.txt

      - name: Refresh the catalogue from Koha's latest book list
        # The club computer publishes books.json next to status.json (see tools/shelf/README.md).
        # If live status is not set up, or the list can't be fetched, the catalogue in the repo is used.
        run: |
          url=$(python -c 'import json; print(json.load(open("content/site.json")).get("shelf_status_url") or "")')
          case "$url" in
            https://*/status.json) python tools/build_catalogue.py --fetch "${url%status.json}books.json" ;;
            *) echo "Live shelf status not set up; using data/koha_books.json from the repository." ;;
          esac

      - name: Build site
        run: python tools/build_site.py

      - name: Publish to the site branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0, pinned to a commit
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: ./_site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish website"
