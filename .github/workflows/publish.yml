# Rebuilds the website whenever something is saved to main (by the admin panel or a push)
# and publishes the result to the `site` branch. GitHub Pages serves that branch, and the
# IITK copy is uploaded from it: download
#   https://github.com/shubhamkmaurya03/bookclubiitk/archive/refs/heads/site.zip
name: Build and publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: new Instagram posts, books newly added in Koha
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned to a commit
        with:
          # The write token is not left in .git/config for every step (pictures from outside are processed
          # below); only the step that saves Instagram posts gets it, and the publish action takes its own.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0, pinned to a commit
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r tools/requirements.txt

      - name: Fetch new Instagram posts
        # Reads the Behold feed in content/instagram.json and saves new posts (caption, link, a copy of the
        # picture) to data/instagram.json and assets/instagram/. Nothing changes if the feed can't be read.
        run: python tools/instagram_feed.py

      - name: Save new Instagram posts to the repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/instagram.json assets/instagram
          if git diff --cached --quiet; then
            echo "No new Instagram posts to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Instagram: new posts"
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
            if git pull -q --rebase && git -c http.https://github.com/.extraheader="$auth" push -q; then :; else
              git rebase --abort 2>/dev/null || true
              echo "Could not save the posts this time; the next run will retry."
            fi
          fi

      - name: Refresh the catalogue from Koha's latest book list
        # The club computer publishes books.json next to status.json (see tools/shelf/README.md).
        # If live status is not set up, or the list can't be fetched, the catalogue in the repo is used.
        run: |
          url=$(python -c 'import json; print(json.load(open("content/site.json")).get("shelf_status_url") or "")')
          case "$url" in
            https://*/status.json) python tools/build_catalogue.py --fetch "${url%status.json}books.json" ;;
            *) echo "Live shelf status not set up; using data/koha_books.json from the repository." ;;
          esac

      - name: Build site
        run: python tools/build_site.py

      - name: Publish to the site branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0, pinned to a commit
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: ./_site
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish website"
